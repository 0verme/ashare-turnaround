[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-turnaround"
version = "0.1.0"
description = "A-share turnaround scanner for low-attention fundamental changes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "0verme" }]
dependencies = [
  "duckdb>=0.10",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "python-dotenv>=1.0",
  "tushare>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
ashare-turnaround = "ashare_turnaround.__main__:main"
